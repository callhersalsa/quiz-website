{% extends "base.html" %}
{% block content %}
<h3 class="text-center fw-bold mb-4">🏆 Global Leaderboard 🏆</h3>

<div class="table-responsive mx-auto leaderboard-box p-3 shadow-sm" style="max-width:600px; border-radius:15px; background:#fff;">
    <table class="table table-hover text-center mb-0" style="color:#533A71;">
        <thead class="gradient-bg text-white rounded-top">
            <tr>
                <th>Rank</th>
                <th>Username</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ user.username }}</td>
                <td>{{ user.score }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
